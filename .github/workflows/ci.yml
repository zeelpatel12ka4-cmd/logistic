name: ChainTrace Enterprise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chaintrace
          POSTGRES_USER: chaintrace
          POSTGRES_PASSWORD: chaintrace_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      ipfs:
        image: ipfs/kubo:v0.32.1
        ports:
          - 5001:5001
          - 8080:8080

    env:
      DATABASE_URL: postgresql://chaintrace:chaintrace_dev_password@localhost:5432/chaintrace
      IPFS_API_URL: http://127.0.0.1:5001
      JWT_SECRET: ci_test_secret_must_be_at_least_32_characters_long
      CHAIN_ID: 31337

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build & Test @chaintrace/shared
        run: |
          npm run build --workspace=@chaintrace/shared
          npm run test --workspace=@chaintrace/shared

      - name: Compile & Test Solidity Contracts
        run: |
          npm run compile --workspace=@chaintrace/contracts
          npm run test --workspace=@chaintrace/contracts

      - name: Build Indexer, API & Web
        run: |
          npm run build --workspace=@chaintrace/indexer
          npm run build --workspace=@chaintrace/api
          npm run build --workspace=@chaintrace/web

      - name: Run Integration Tests (Postgres + Hardhat + IPFS)
        run: |
          npm run db:migrate
          npm run test --workspace=@chaintrace/indexer -- --runInBand
          npm run test --workspace=@chaintrace/api -- --runInBand
